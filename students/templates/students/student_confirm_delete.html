{% extends 'students/base.html' %}

{% block title %}删除 - {{ student.name }}{% endblock %}

{% block content %}

<div class="breadcrumb">
    <a href="{% url 'index' %}">首页</a><span class="sep">/</span>
    <a href="{% url 'student_list' %}">学生列表</a><span class="sep">/</span>
    <a href="{% url 'student_detail' student.pk %}">{{ student.name }}</a><span class="sep">/</span>
    <span class="current">删除</span>
</div>

<div class="confirm-card">
    <div class="card-head">确认删除</div>
    <div class="card-body">
        <p style="margin:0 0 0.5rem">确定要删除以下学生信息？</p>
        <p style="font-weight:600; margin:0">{{ student.name }} — {{ student.class_name.name }}</p>
        <p class="warn-text">删除后数据不可恢复</p>
    </div>
    <div class="card-foot" style="display:flex; justify-content:center">
        <form method="post" style="display:inline">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">确认删除</button>
            <a href="{% url 'student_detail' student.pk %}" class="btn btn-outline" style="margin-left:0.4rem">取消</a>
        </form>
    </div>
</div>

{% endblock %}
